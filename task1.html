<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Train Ticket</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/task1.css">
</head>
<body class="bg-light py-5">
    <div class="container my-4" style="max-width: 800px;">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 custom-card">
            <h1 class="h3 fw-bold text-white mb-4 p-3 rounded-3 custom-header">Book a train ticket</h1>
            
            <form>
                <div class="mb-4">
                    <div class="btn-group w-100 p-1 custom-pill-group" role="group">
                        <input type="radio" class="btn-check" name="tripType" id="oneway" autocomplete="off" checked>
                        <label class="btn btn-outline-success rounded-pill fw-semibold" for="oneway">One way</label>

                        <input type="radio" class="btn-check" name="tripType" id="roundtrip" autocomplete="off">
                        <label class="btn btn-outline-success rounded-pill fw-semibold" for="roundtrip">Round trip</label>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="fromCity" class="form-label fw-semibold text-secondary">From</label>
                        <input type="text" class="form-control" id="fromCity" value="Astana" required>
                    </div>
                    <div class="col-md-6">
                        <label for="toCity" class="form-label fw-semibold text-secondary">To</label>
                        <input type="text" class="form-control" id="toCity" value="Almaty" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label for="departureDate" class="form-label fw-semibold text-secondary">Departure</label>
                        <input type="date" class="form-control" id="departureDate" required>
                    </div>
                    <div class="col-md-4">
                        <label for="returnDate" class="form-label fw-semibold text-secondary">Return</label>
                        <input type="date" class="form-control" id="returnDate">
                    </div>
                    <div class="col-md-4">
                        <label for="passengers" class="form-label fw-semibold text-secondary">Passengers</label>
                        <select class="form-select" id="passengers">
                            <option value="1" selected>1 adult</option>
                            <option value="2">2 adults</option>
                            <option value="3">3 adults</option>
                            <option value="4">4 adults</option>
                            <option value="5">5 adults</option>
                            <option value="6">6 adults</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary d-block">Carriage class</label>
                    <div class="d-flex gap-4">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="carriageClass" id="seat" required>
                            <label class="form-check-label" for="seat">Seat</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="carriageClass" id="coupe" checked>
                            <label class="form-check-label" for="coupe">Coupé</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="carriageClass" id="sleeper">
                            <label class="form-check-label" for="sleeper">Sleeper</label>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-semibold text-secondary">Phone</label>
                        <div class="input-group">
                            <span class="input-group-text bg-success text-white fw-bold">+7</span>
                            <input type="tel" class="form-control" id="phone" placeholder="701-2345678" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold text-secondary">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" role="switch" id="smsSwitch">
                        <label class="form-check-label text-muted" for="smsSwitch">Also send the ticket by SMS</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rulesCheck" required>
                        <label class="form-check-label text-muted" for="rulesCheck">I agree with the carriage rules</label>
                    </div>
                </div>

                <div class="d-flex flex-column flex-md-row gap-3 justify-content-end action-buttons">
                    <button type="submit" class="btn btn-warning text-dark fw-bold px-4 py-2 order-1 order-md-2">Find trains</button>
                    <button type="reset" class="btn btn-outline-secondary px-4 py-2 order-2 order-md-1">Clear</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
