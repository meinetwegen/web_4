<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserve a Table</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <style>
        input:user-invalid ~ .invalid-feedback,
        select:user-invalid ~ .invalid-feedback,
        textarea:user-invalid ~ .invalid-feedback {
            display: block;
        }
        input:user-valid {
            border-color: #198754;
        }
    </style>
</head>
<body class="bg-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow border-0 p-4">
            <h2 class="mb-4 text-center fw-bold text-primary">Reserve a table</h2>
            <form class="needs-validation" novalidate> 
                <div class="mb-3">
                    <label for="name" class="form-label">Your name *</label>
                    <input type="text" class="form-control" id="name" required>
                    <div class="invalid-feedback">Please enter your name.</div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email *</label>
                    <input type="email" class="form-control" id="email" required>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone *</label>
                    <input type="tel" class="form-control" id="phone" required>
                    <div class="invalid-feedback">Please enter your phone number.</div>
                </div>
                <div class="mb-3">
                    <label for="guests" class="form-label">Guests *</label>
                    <input type="number" class="form-control" id="guests" min="1" max="20" required>
                    <div class="invalid-feedback">Please specify a number of guests (1-20).</div>
                </div>
                <div class="mb-3">
                    <label for="reservation-date" class="form-label">Date *</label>
                    <input type="date" class="form-control" id="reservation-date" required>
                    <div class="invalid-feedback">Please select a reservation date.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label d-block">Seating</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="seating" id="seating-inside" value="Inside" checked>
                        <label class="form-check-label" for="seating-inside">Inside</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="seating" id="seating-terrace" value="Terrace">
                        <label class="form-check-label" for="seating-terrace">Terrace</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="meal" class="form-label">Meal type</label>
                    <select class="form-select" id="meal">
                        <option value="" disabled selected>Select meal</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="comments" class="form-label">Comments</label>
                    <textarea class="form-control" id="comments" rows="3"></textarea>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="terms" required>
                    <label class="form-check-label" for="terms">I agree to the terms *</label>
                    <div class="invalid-feedback">You must agree before submitting.</div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Reserve</button>
            </form>
        </div>
    </div>
</body>
</html>
